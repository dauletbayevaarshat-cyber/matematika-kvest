<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a6f86">
<title>Математика квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Сызбаның идеясы: әр тапсырма — дүкен чегі сияқты қағаз карточка; көк аспан мен күн сарысы — жазбаның түсі */
  --sky:#0a6f86;
  --sky-deep:#064556;
  --sun:#ffc21a;
  --paper:#ffffff;
  --bg:#e6f3f6;
  --ink:#14282e;
  --muted:#5b7279;
  --line:#c9dde2;
  --good:#1a8f4c;
  --good-bg:#e3f6ea;
  --bad:#c8392f;
  --bad-bg:#fdecea;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px 40px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;flex:1;letter-spacing:-.01em;color:var(--sky-deep);text-wrap:balance}
.iconbtn{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:20px;font-weight:900;flex:none}
.pill{background:var(--sky-deep);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{color:var(--sun)}

/* hero */
.hero{background:var(--sky);color:#fff;border-radius:24px;padding:26px 22px 22px;margin-top:8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--sun);opacity:.95}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;margin:0 0 10px;position:relative;z-index:1;letter-spacing:-.02em}
.hero p{margin:0;position:relative;z-index:1;max-width:30ch;font-weight:700;opacity:.95}
.hero .tenge{position:absolute;right:22px;top:14px;z-index:2;font-family:var(--f-display);font-size:58px;font-weight:800;color:var(--sky-deep)}

.card{background:var(--paper);border-radius:20px;padding:20px;border:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
label.lbl{font-weight:800;font-size:16px;display:block;margin-bottom:6px}
.field{width:100%;height:56px;border-radius:14px;border:2px solid var(--line);padding:0 16px;font-size:19px;font-weight:700;background:#fff}
.field:focus{border-color:var(--sky);outline:none}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grades button{height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:19px}
.grades button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.btn{min-height:58px;border-radius:16px;border:0;padding:12px 20px;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #d79d00}
.btn-blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-deep)}
.btn-ghost{background:var(--paper);border:2px solid var(--line);color:var(--sky-deep)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:800;font-size:16px;min-height:1.2em;margin:0}
.note{color:var(--muted);font-size:16px;margin:0}

/* map */
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.hello h2{margin:0;font-size:21px;font-weight:900;line-height:1.2}
.hello p{margin:0;color:var(--muted);font-size:15px;font-weight:700}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{background:var(--paper);border-radius:22px;border:2px solid var(--line);overflow:hidden}
.world-top{display:flex;gap:14px;align-items:center;padding:16px 16px 12px}
.wicon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none}
.world h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.2}
.world .sub{margin:2px 0 0;color:var(--muted);font-size:15px;font-weight:700}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}
.lvl{border-radius:16px;border:2px solid var(--line);background:#f7fbfc;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;font-weight:900}
.lvl .n{font-size:24px;font-family:var(--f-display);font-weight:800}
.lvl .t{font-size:13px;color:var(--muted);font-weight:800}
.lvl .st{font-size:16px;letter-spacing:1px;color:#c8d6da}
.lvl .st .on{color:var(--sun)}
.lvl.open{background:#fff;border-color:var(--sky);box-shadow:0 3px 0 var(--sky)}
.lvl.done{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.lvl.locked{opacity:.55;cursor:not-allowed}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

/* receipt */
.progress{height:12px;background:#d2e6eb;border-radius:999px;overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .3s}
.receipt{background:var(--paper);border-radius:6px;padding:22px 20px 24px;position:relative;box-shadow:0 6px 18px rgba(10,70,86,.10);
  -webkit-mask:radial-gradient(circle 8px at 50% 0,transparent 98%,#000) 0 0/22px 51% repeat-x,radial-gradient(circle 8px at 50% 100%,transparent 98%,#000) 0 100%/22px 51% repeat-x;
          mask:radial-gradient(circle 8px at 50% 0,transparent 98%,#000) 0 0/22px 51% repeat-x,radial-gradient(circle 8px at 50% 100%,transparent 98%,#000) 0 100%/22px 51% repeat-x}
.rhead{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding-bottom:12px;border-bottom:2px dashed var(--line);margin-bottom:16px}
.situ{font-size:15px;font-weight:800;color:var(--sky);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.q{font-size:21px;font-weight:800;line-height:1.35;margin:0 0 18px;text-wrap:pretty}
.q .num{font-family:var(--f-mono);font-weight:700;background:#fff4cc;padding:0 4px;border-radius:5px;white-space:nowrap}
.answer-row{display:flex;gap:10px;align-items:stretch}
.inwrap{flex:1;position:relative;display:flex}
.inwrap input{flex:1;min-width:0;height:64px;border-radius:16px;border:3px solid var(--line);padding:0 64px 0 16px;font-family:var(--f-mono);font-size:26px;font-weight:700;background:#fff}
.inwrap input:focus{border-color:var(--sky);outline:none}
.inwrap .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--muted);font-size:18px;pointer-events:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:70px;border-radius:16px;border:3px solid var(--line);background:#fff;font-family:var(--f-mono);font-weight:700;font-size:20px;padding:8px;line-height:1.2}
.opt.wide{font-family:var(--f-body);font-size:17px;font-weight:800}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.tools{display:flex;gap:10px;margin-top:14px}
.tools .btn{min-height:50px;font-size:17px}
.hintbox{margin-top:14px;background:#fff7db;border:2px solid #ffe08a;border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px}
.hintbox b{color:#8a6400}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:800}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.show{background:#eef6f8;color:var(--sky-deep)}
.fb h4{margin:0 0 4px;font-size:19px}
.fb p{margin:0;font-size:16px;color:var(--ink);font-weight:700}
.steps{margin:14px 0 0;padding:12px 0 0;border-top:2px dashed var(--line);list-style:none;display:flex;flex-direction:column;gap:6px}
.steps li{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--ink);display:flex;gap:8px}
.steps li::before{content:"›";color:var(--sky);font-weight:700}
.steps .total{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.stamp{position:absolute;right:14px;top:58px;font-family:var(--f-display);font-weight:800;font-size:22px;padding:6px 12px;border:4px solid currentColor;border-radius:10px;transform:rotate(-12deg);pointer-events:none;opacity:0}
.stamp.g{color:var(--good)}
.stamp.on{animation:stamp .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}100%{opacity:.9;transform:rotate(-12deg) scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.next{margin-top:16px}
.gain{font-family:var(--f-mono);font-weight:700;color:var(--good)}

/* result */
.res{text-align:center;padding:26px 20px}
.res .stars{font-size:52px;letter-spacing:6px;color:#d4e1e4;margin:4px 0}
.res .stars .on{color:var(--sun);text-shadow:0 3px 0 #d79d00}
.res h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:6px 0 4px;text-wrap:balance}
.res p{margin:0 0 14px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.stat{background:#f2f8fa;border-radius:14px;padding:10px 4px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;color:var(--sky-deep)}
.stat span{font-size:13px;font-weight:800;color:var(--muted)}
.newbadge{background:#fff7db;border:2px solid #ffe08a;border-radius:14px;padding:10px;font-weight:800;margin-bottom:14px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.badge .e{font-size:34px;filter:grayscale(1);opacity:.35}
.badge h4{margin:4px 0 2px;font-size:16px;font-weight:900}
.badge p{margin:0;font-size:13px;color:var(--muted);font-weight:700;line-height:1.3}
.badge.got{border-color:var(--sun);background:#fffbea}
.badge.got .e{filter:none;opacity:1}
.section-t{font-family:var(--f-display);font-weight:600;font-size:17px;margin:22px 0 10px;color:var(--sky-deep)}
.copybox{width:100%;min-height:150px;border-radius:14px;border:2px solid var(--line);padding:12px;font-family:var(--f-mono);font-size:14px;resize:vertical;background:#fff}
.help h3{font-size:18px;margin:0 0 6px;font-weight:900}
.help ol,.help ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:17px}
.legend{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
.legend span{font-family:var(--f-mono);font-weight:700;color:var(--good)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;z-index:20;max-width:90vw;text-align:center}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stamp.on{opacity:.9}}
@media (max-width:380px){.hero .big{font-size:28px}.q{font-size:19px}.opt{font-size:18px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<canvas class="confetti hidden" id="confetti"></canvas>

<script>
/* ============ ТАПСЫРМАЛАР ============ */
const WORLDS = [
 {id:"shop", name:"Дүкенде", sub:"Жеңілдік, пайыз, қайтарым", icon:"🛒", color:"#ffe9b0", badge:"Үнемшіл сатып алушы",
  levels:[
   [
    {s:"Кітап дүкені", q:"Кітаптың бағасы [2000 ₸]. Оған [10%] жеңілдік жасалды. Жеңілдік неше теңге?", t:"c", o:["200 ₸","100 ₸","1800 ₸","20 ₸"], a:"200 ₸",

     h:"Алдымен жеңілдікті тап: 5000-ның 20%-ы. Содан кейін бағадан шегер.", st:["5000-ның 20%-ы = 5000 · 0,2 = 1000","5000 − 1000 = 4000","Жаңа баға = 4000 ₸"]},

   [
    {s:"Спорт дүкені", q:"Кроссовка [25 000 ₸]. Оған [30%] жеңілдік бар. Сен қанша төлейсің?", t:"n", a:17500, u:"₸",
     h:"30% жеңілдік болса, бағаның 70%-ын төлейсің. 25000 · 0,7 есепте.", st:["100% − 30% = 70%","25000 · 0,7 = 17500","Төлем = 17 500 ₸"]},
    {s:"Акция", q:"Акция: «[2] шырын алсаң, [3]-ші шырын тегін». Бір шырын [400 ₸]. [3] шырын үшін қанша төлейсің?", t:"c", o:["800 ₸","1200 ₸","400 ₸","1000 ₸"], a:"800 ₸",
     h:"Үшінші шырын тегін — ақшаны тек екеуіне төлейсің.", st:["Ақылы шырын: 2","2 · 400 = 800","Төлем = 800 ₸"]},
    {s:"Қай дүкен тиімді?", q:"А дүкенде [1 л] сүт [520 ₸]. Б дүкенде [0,5 л] сүт [270 ₸]. Қай дүкенде сүт арзанырақ?", t:"c", o:["А дүкен","Б дүкен","Бағасы бірдей","Анықтау мүмкін емес"], a:"А дүкен", wide:true,
     h:"Екі дүкендегі 1 литрдің бағасын салыстыр. Б дүкенде 1 л = 2 бөтелке.", st:["А: 1 л = 520 ₸","Б: 1 л = 270 · 2 = 540 ₸","520 < 540 → А дүкен арзан"]},
    {s:"Жеңілдік", q:"Сөмке бұрын [8000 ₸] болатын, енді [6000 ₸]. Неше пайыз жеңілдік жасалды?", t:"c", o:["25%","20%","33%","2000%"], a:"25%",
     h:"Алдымен баға қаншаға түскенін тап. Сосын оны бұрынғы бағаға бөл.", st:["8000 − 6000 = 2000","2000 : 8000 = 0,25","0,25 = 25%"]}
   ],
   [
    {s:"Екі рет жеңілдік", q:"Телефон [120 000 ₸]. Алдымен [10%], содан кейін жаңа бағадан тағы [10%] жеңілдік жасалды. Соңғы баға қанша?", t:"c", o:["97 200 ₸","96 000 ₸","98 000 ₸","100 000 ₸"], a:"97 200 ₸",

     h:"Бірінші өзгерістен кейінгі бағаны тап. Екінші пайыз сол жаңа бағадан алынады.", st:["10000 · 1,2 = 12000","12000 · 0,8 = 9600","Соңғы баға = 9600 ₸ (бастапқыдан арзан!)"]},

     h:"14000-ның 5%-ын тап: 14000 · 0,05.", st:["5% = 0,05","14000 · 0,05 = 700","Кешбэк = 700 ₸"]},
    {s:"Жеңілдік картасы", q:"Отбасың дүкенге айына [50 000 ₸] жұмсайды. Жеңілдік картасы [3%] үнемдетеді. [1 жылда] қанша үнемдейсіңдер?", t:"n", a:18000, u:"₸",
     h:"Алдымен бір айда қанша үнемдейтінін тап, сосын 12 айға көбейт.", st:["50000 · 0,03 = 1500 (бір айда)","1500 · 12 = 18000","Жылдық үнем = 18 000 ₸"]}
   ]
  ]},
 {id:"phone", name:"Телефон және интернет", sub:"Тариф, гигабайт, баланс", icon:"📱", color:"#cfeef6", badge:"Цифрлық шебер",
  levels:[
   [
    {s:"Тариф", q:"Ұялы байланыс тарифі айына [2500 ₸]. [3 айға] қанша төлейсің?", t:"n", a:7500, u:"₸",
     h:"Бір айдың бағасын 3-ке көбейт.", st:["2500 · 3 = 7500","Төлем = 7500 ₸"]},
    {s:"Интернет пакеті", q:"[1 ГБ] интернет [300 ₸]. [5 ГБ] қанша тұрады?", t:"c", o:["1500 ₸","1200 ₸","305 ₸","3000 ₸"], a:"1500 ₸",
     h:"1 ГБ бағасын 5-ке көбейт.", st:["300 · 5 = 1500","Бағасы = 1500 ₸"]},

const KEY = "mq-v1";
let save = {name:"", grade:"", levels:{}, badges:[]};
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && typeof s==="object") save = Object.assign(save, s);}catch(e){} }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }

/* ============ КӨМЕКШІЛЕР ============ */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const qhtml = q => esc(q).replace(/\[([^\]]+)\]/g,'<span class="num">$1</span>');
const lkey = (w,l) => w+"-"+l;
const starsOf = pts => pts>=34?3:pts>=20?2:pts>0?1:0;
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n?'<span class="on">★</span>':'★'; return s; }
function totalPoints(){ return Object.values(save.levels).reduce((a,r)=>a+(r.best||0),0); }
function totalStars(){ return Object.values(save.levels).reduce((a,r)=>a+(r.stars||0),0); }
function isDone(w,l){ return !!save.levels[lkey(w,l)]; }
function isOpen(wi,li){ return li===0 || isDone(WORLDS[wi].id, li-1); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=document.createElement("div"); t.className="toast fade"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function parseNum(s){ s=String(s).replace(/[\s₸]/g,"").replace(/[a-zA-Zа-яА-ЯәғқңөұүһіӘҒҚҢӨҰҮҺІ·]+$/,"").replace(",","."); if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN; return Number(s); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p);}catch(e){} }

/* --- Ойын --- */
function startLevel(wi,li){
  game = {wi, li, i:0, pts:0, correct:0, hints:0, tries:0, hintShown:false, done:false, opts:null};
  go("play");
}
function curTask(){ return WORLDS[game.wi].levels[game.li][game.i]; }

function renderPlay(){
  const w = WORLDS[game.wi], tasks = w.levels[game.li], t = curTask();
  if(!game.opts && t.t==="c") game.opts = shuffle(t.o);
  const pct = (game.i)/tasks.length*100;
  $app.innerHTML = `
  <div class="bar">
    <button class="iconbtn" id="quit" aria-label="Картаға шығу">✕</button>
    <h1>${w.icon} ${w.name} · ${game.li+1}</h1>
    <span class="pill"><b>${game.pts}</b> ұпай</span>
  </div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${tasks.length}" aria-valuenow="${game.i}"><i style="width:${pct}%"></i></div>
  <article class="receipt fade" id="rc">
    <div class="rhead"><span>ТАПСЫРМА №${game.i+1}/${tasks.length}</span><span>${LEVEL_NAMES[game.li].toUpperCase()}</span></div>
    <div class="stamp g" id="stamp" aria-hidden="true">ДҰРЫС!</div>
    <p class="situ">${esc(t.s)}</p>
    <p class="q">${qhtml(t.q)}</p>
    <div id="ans"></div>
    <div id="hintArea"></div>
    <div id="fbArea" aria-live="polite"></div>
  </article>`;
  document.getElementById("quit").onclick=()=>go("map");
  drawAnswer();
}

function drawAnswer(){
  const t = curTask(), box = document.getElementById("ans");
  if(t.t==="c"){
    box.innerHTML = `<div class="opts">${game.opts.map((o,k)=>`<button class="opt${t.wide?" wide":""}" data-k="${k}" type="button">${esc(o)}</button>`).join("")}</div>
    <div class="tools" id="tools"><button class="btn btn-ghost" id="hintBtn" type="button">💡 Кеңес</button></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(game.done||b.disabled) return; checkChoice(b); });
  } else {
    box.innerHTML = `<form id="numForm" novalidate>
      <div class="answer-row"><div class="inwrap">
        <input id="numIn" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Жауабың" aria-label="Жауабыңды сан түрінде жаз">
        <span class="unit">${esc(t.u||"")}</span></div></div>
      <p class="note" style="margin-top:8px">Тек санды жаз. Мысалы: <b>17500</b> немесе <b>2,5</b></p>
      <div class="tools" id="tools">
        <button class="btn btn-ghost" id="hintBtn" type="button" style="flex:1">💡 Кеңес</button>
        <button class="btn btn-blue" type="submit" id="checkBtn" style="flex:1.4">Тексеру ✓</button>
      </div></form>`;
    const f = document.getElementById("numForm");
    f.onsubmit = e=>{ e.preventDefault(); if(!game.done) checkNum(); };
    const inp = document.getElementById("numIn");
    if(matchMedia("(pointer:fine)").matches) inp.focus();
  }
  document.getElementById("hintBtn").onclick = showHint;
}

function showHint(){
  if(game.hintShown) return;
  game.hintShown = true; game.hints++;
  document.getElementById("hintArea").innerHTML = `<div class="hintbox fade"><b>💡 Кеңес:</b> ${esc(curTask().h)}</div>`;
  const hb = document.getElementById("hintBtn"); if(hb){ hb.disabled=true; }
}

function checkChoice(btn){
  const t = curTask(), val = btn.textContent;
  if(val===t.a){ btn.classList.add("right"); onRight(); }
  else { btn.classList.add("wrong"); btn.disabled = true; onWrong(); }
}
function checkNum(){
  const t = curTask(), inp = document.getElementById("numIn"), raw = inp.value;
  const v = parseNum(raw);
  if(raw.trim()===""){ softMsg("Алдымен жауабыңды жаз ✍️"); inp.focus(); return; }
  if(isNaN(v)){ softMsg("Тек санды жаз. Мысалы: 1500 немесе 2,5"); inp.focus(); return; }
  if(Math.abs(v - t.a) < 1e-9){ inp.style.borderColor="var(--good)"; inp.style.background="var(--good-bg)"; inp.readOnly=true; onRight(); }
  else { inp.style.borderColor="var(--bad)"; onWrong(); if(!game.done){ inp.select(); } }
}
function softMsg(m){ document.getElementById("fbArea").innerHTML = `<div class="fb show fade"><p>${esc(m)}</p></div>`; }

function onRight(){
  const t = curTask();
  game.tries++;
  let gain = game.tries===1 ? 10 : 5;
  if(game.hintShown) gain -= 2;
  game.pts += gain; game.correct++; game.done = true;
  vibrate(30);
  document.getElementById("stamp").classList.add("on");
  lockInputs();
  const praise = ["Керемет!","Жарайсың!","Тамаша!","Дұп-дұрыс!","Сен мықтысың!"][Math.floor(Math.random()*5)];
  document.getElementById("fbArea").innerHTML = `<div class="fb good fade"><h4>✅ ${praise} <span class="gain">+${gain} ұпай</span></h4>
    <ul class="steps">${stepsHtml(t)}</ul></div>${nextBtn()}`;
  bindNext();
  updatePill();
}
function onWrong(){
  const t = curTask();
  game.tries++;
  vibrate([60,40,60]);
  const rc = document.getElementById("rc"); rc.classList.remove("shake"); void rc.offsetWidth; rc.classList.add("shake");
  if(game.tries===1){
    if(!game.hintShown) showHint();
    document.getElementById("fbArea").innerHTML = `<div class="fb bad fade"><h4>Әзірге дұрыс емес 🙂</h4><p>Кеңесті оқып, тағы бір рет көр. Сен міндетті түрде табасың!</p></div>`;
  } else {
    game.done = true;
    lockInputs(true);
    const ans = t.t==="c" ? t.a : fmt(t.a)+" "+(t.u||"");
    document.getElementById("fbArea").innerHTML = `<div class="fb show fade"><h4>Дұрыс жауабы: ${esc(ans)}</h4><p>Ештеңе етпейді! Шешуін қарап шық, келесіде міндетті түрде шығарасың.</p>
      <ul class="steps">${stepsHtml(t)}</ul></div>${nextBtn()}`;
    bindNext();
  }
}
function stepsHtml(t){ return t.st.map((s,k)=>`<li class="${k===t.st.length-1?"total":""}">${esc(s)}</li>`).join(""); }
function lockInputs(reveal){
  const t = curTask();
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(reveal && b.textContent===t.a) b.classList.add("right"); });
  const inp = document.getElementById("numIn"); if(inp) inp.readOnly = true;
  const tools = document.getElementById("tools"); if(tools) tools.classList.add("hidden");
}
function nextBtn(){
  const last = game.i === WORLDS[game.wi].levels[game.li].length-1;
  return `<button class="btn btn-main next" id="nextBtn" type="button">${last?"Нәтижені көру 🏁":"Келесі тапсырма →"}</button>`;
}
function bindNext(){
  const b = document.getElementById("nextBtn");
  b.onclick = nextTask;
  setTimeout(()=>{ b.scrollIntoView({behavior:"smooth", block:"nearest"}); b.focus({preventScroll:true}); }, 120);
}
function updatePill(){ const p=document.querySelector(".bar .pill b"); if(p) p.textContent=game.pts; }
function nextTask(){
  const tasks = WORLDS[game.wi].levels[game.li];
  if(game.i < tasks.length-1){
    game.i++; game.tries=0; game.hintShown=false; game.done=false; game.opts=null;
    renderPlay();
  } else finishLevel();
}

function finishLevel(){
  const w = WORLDS[game.wi], k = lkey(w.id, game.li);
  const stars = starsOf(game.pts);
  const prev = save.levels[k];
  const record = !prev || game.pts > prev.best;
  save.levels[k] = {best: Math.max(game.pts, prev?prev.best:0), stars: Math.max(stars, prev?prev.stars:0), correct: Math.max(game.correct, prev?prev.correct||0:0), last: game.pts};
  const newB = [];
  const give = id => { if(!save.badges.includes(id)){ save.badges.push(id); newB.push(id);} };
  give("first");
  if(stars===3) give("perfect");
  if(game.hints===0) give("self");
  WORLDS.forEach(ww=>{ if(ww.levels.every((_,li)=>isDone(ww.id,li))) give(ww.id); });
  if(WORLDS.every(ww=>ww.levels.every((_,li)=>isDone(ww.id,li)))) give("champ");
  persist();
  lastResult = {wi:game.wi, li:game.li, pts:game.pts, stars, correct:game.correct, total:w.levels[game.li].length, hints:game.hints, newB, record:record && !!prev};
  go("result");
  if(stars>=2) confetti();
}

/* --- Нәтиже --- */

  const msg = r.stars===3 ? ["Керемет, "+save.name+"!","Сен нағыз математиксің!"] :

      ${hasNext?`<button class="btn btn-main" id="nextLvl" type="button">${r.li+2}-деңгейге өту →</button>`:''}

  document.getElementById("back").onclick=()=>go("map");
  document.getElementById("toMap").onclick=()=>go("map");
  document.getElementById("again").onclick=()=>startLevel(r.wi,r.li);
  if(hasNext) document.getElementById("nextLvl").onclick=()=>startLevel(r.wi,r.li+1);
  document.getElementById("share").onclick=()=>{ go("me"); setTimeout(()=>{ const el=document.getElementById("shareSec"); el&&el.scrollIntoView({behavior:"smooth"}); },50); };
}

/* --- Жетістіктер --- */
function reportText(){
  const lines = ["📘 Математика квест — нәтиже", "Оқушы: "+save.name+", "+save.grade+"-сынып", ""];
  WORLDS.forEach(w=>{
    w.levels.forEach((_,li)=>{
      const r = save.levels[lkey(w.id,li)];
      if(r) lines.push(w.icon+" "+w.name+" · "+(li+1)+"-деңгей: "+r.best+" ұпай, "+"★".repeat(r.stars)+"☆".repeat(3-r.stars));
    });
  });
  if(lines.length===4) lines.push("Әзірге бірде-бір деңгей аяқталған жоқ.");
  lines.push("", "Жалпы: "+totalPoints()+" ұпай, "+totalStars()+"/36 жұлдыз", "Белгілер: "+save.badges.length+"/"+BADGES.length);
  return lines.join("\n");
}

  $app.innerHTML = `

    catch(e){ ta.focus(); ta.select(); toast("Мәтінді белгілеп, «Көшіру» деп бас"); }
  };
  document.getElementById("rename").onclick=()=>go("start");
  let armed=false;

    save.levels={}; save.badges=[]; persist(); toast("Нәтижелер өшірілді"); go("map");
  };
}

    <button class="btn btn-main" id="go" type="button">Түсінікті, ойнаймын! →</button>
  </div>`;
  const back = ()=> go(save.name&&save.grade ? "map" : "start");
  document.getElementById("back").onclick=back;
  document.getElementById("go").onclick=back;
}

/* --- Конфетти --- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"), x=c.getContext("2d");
  c.classList.remove("hidden"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#ffc21a","#0a6f86","#1a8f4c","#ff7a59","#7fd3e6"];
  const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<170) requestAnimationFrame(tick); else { x.clearRect(0,0,c.width,c.height); c.classList.add("hidden"); }
  })();
}

/* ============ ІСКЕ ҚОСУ ============ */
function start(data){
  load();
  if(data && data.save) save = Object.assign(save, data.save);
  view = save.name && save.grade ? "map" : "start";
  render();
}
window.claude?.hot?.snapshot?.(()=>({save}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
